<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="Shivam Rathod Arcade Cabinet GitHub profile">
  <defs>
    <linearGradient id="cab" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#171c28"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#090d17"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pixel{font-family:monospace;font-weight:700;letter-spacing:3px}
      .small{font-family:monospace;letter-spacing:1px}
      .bar{animation:pulse 1.8s ease-in-out infinite alternate}
      .bar2{animation:pulse 2.4s ease-in-out infinite alternate-reverse}
      @keyframes pulse{from{opacity:.65}to{opacity:1}}
      .coin{animation:blink 1.2s steps(2,end) infinite}
      @keyframes blink{50%{opacity:.35}}
      .player{animation:move 7s linear infinite}
      @keyframes move{0%{transform:translateX(0)}50%{transform:translateX(110px)}100%{transform:translateX(0)}}
    </style>
  </defs>

  <rect width="1200" height="820" rx="28" fill="#080b11"/>
  <path d="M105 70 L1095 70 L1145 150 L1145 770 L55 770 L55 150 Z" fill="url(#cab)" stroke="#293143" stroke-width="5"/>
  <rect x="135" y="92" width="930" height="105" rx="16" fill="#6f2f1e" stroke="#9b472d" stroke-width="5"/>
  <text x="600" y="158" text-anchor="middle" fill="#10131a" font-size="56" class="pixel">SHIVAM RATHOD</text>

  <rect x="130" y="225" width="940" height="390" rx="25" fill="#151b29" stroke="#2a3347" stroke-width="7"/>
  <rect x="165" y="260" width="870" height="320" rx="18" fill="url(#screen)" stroke="#090b12" stroke-width="18"/>

  <text x="205" y="305" fill="#9ba1ad" font-size="32" class="pixel">SCORE 1565</text>
  <text x="850" y="305" fill="#f08b24" font-size="25" class="pixel">HTML</text>
  <text x="915" y="305" fill="#3e91c9" font-size="25" class="pixel">PY</text>
  <text x="970" y="305" fill="#a58bd5" font-size="25" class="pixel">CSS</text>

  <g fill="#273247">
    <circle cx="230" cy="345" r="2"/><circle cx="270" cy="390" r="2"/><circle cx="325" cy="350" r="2"/>
    <circle cx="400" cy="410" r="2"/><circle cx="455" cy="365" r="2"/><circle cx="520" cy="450" r="2"/>
    <circle cx="590" cy="350" r="2"/><circle cx="650" cy="400" r="2"/><circle cx="720" cy="345" r="2"/>
    <circle cx="780" cy="445" r="2"/><circle cx="850" cy="370" r="2"/><circle cx="920" cy="420" r="2"/>
  </g>

  <g transform="translate(210,550)" fill="#7d3a28">
    <rect class="bar" x="0" y="-80" width="24" height="80"/><rect class="bar2" x="30" y="-125" width="24" height="125"/>
    <rect class="bar" x="60" y="-105" width="24" height="105"/><rect class="bar2" x="90" y="-145" width="24" height="145"/>
    <rect class="bar" x="120" y="-92" width="24" height="92"/><rect class="bar2" x="150" y="-155" width="24" height="155"/>
    <rect class="bar" x="180" y="-115" width="24" height="115"/><rect class="bar2" x="210" y="-135" width="24" height="135"/>
    <rect class="bar" x="240" y="-72" width="24" height="72"/><rect class="bar2" x="270" y="-105" width="24" height="105"/>
    <rect class="bar" x="300" y="-88" width="24" height="88"/><rect class="bar2" x="330" y="-125" width="24" height="125"/>
    <rect class="bar" x="360" y="-55" width="24" height="55"/><rect class="bar2" x="390" y="-74" width="24" height="74"/>
    <rect class="bar" x="420" y="-66" width="24" height="66"/><rect class="bar2" x="450" y="-45" width="24" height="45"/>
    <rect class="bar" x="480" y="-80" width="24" height="80"/><rect class="bar2" x="510" y="-52" width="24" height="52"/>
    <rect class="bar" x="540" y="-38" width="24" height="38"/><rect class="bar2" x="570" y="-62" width="24" height="62"/>
    <rect class="bar" x="600" y="-44" width="24" height="44"/>
  </g>

  <g class="player" filter="url(#glow)">
    <rect x="610" y="450" width="18" height="30" fill="#d8d8d8"/>
    <rect x="603" y="465" width="32" height="10" fill="#d8d8d8"/>
  </g>

  <g transform="translate(130,635)">
    <path d="M0 0 H940 L900 125 H40 Z" fill="#171d2a" stroke="#293143" stroke-width="5"/>
    <circle cx="115" cy="60" r="27" fill="#7e2a2a"/>
    <circle cx="115" cy="88" r="22" fill="#07090e"/>
    <rect x="108" y="60" width="14" height="35" fill="#171717"/>
    <rect x="360" y="32" width="92" height="92" fill="#4c4d55" stroke="#9a351e" stroke-width="5"/>
    <rect x="380" y="52" width="52" height="20" fill="#a74bc0"/>
    <rect x="396" y="36" width="20" height="52" fill="#a74bc0"/>
    <rect x="396" y="68" width="20" height="52" fill="#a74bc0"/>
    <text x="318" y="93" fill="#8c3b29" font-size="28" class="small">P1</text>
    <circle class="coin" cx="610" cy="70" r="27" fill="#b18a36"/>
    <circle cx="690" cy="70" r="27" fill="#287341"/>
    <circle cx="770" cy="70" r="27" fill="#3b6291"/>
  </g>

  <text x="600" y="795" text-anchor="middle" fill="#657086" font-size="18" class="small">
    AI &amp; DATA SCIENCE • WEB • PYTHON • JAVASCRIPT
  </text>
</svg>
